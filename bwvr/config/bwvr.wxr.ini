; The settings of the mod for a WinlatorXR container.
;
; This file ships as bwvr.ini beside runblack.exe. A key that is not here
; takes the default that is in the code.
;
; See Docs/ClaudeCode/PROJECT_PLAN.md and bwvr/docs/backend.md.

[bwvr]

; The game keeps its own DirectDraw 7 and Direct3D 7. The container upgrades
; them above the game. So the mod loads no dxwrapper, and it makes no
; Direct3D 9 and no Vulkan renderer of its own.
backend=system

; No bridge to Direct3D 11. There is no OpenXR runtime to hand a texture to:
; the runtime of the headset captures the window of the game.
gpu_bridge=0

; The window is the output. The runtime captures it, so it must fill the
; display and the pixel at its top left corner must be the game's own. With
; window_fit=1 the mod reshapes the window to the shape of the render, and
; then the sync pixel is never read. 1 is the behavior of the PCVR mod.
window_fit=0

; Mono. The scene is walked one time, the eye cameras are one camera at the
; head, and the window goes to both eyes of the headset (MODE_3D=0). A walk
; of the scene is the largest cost of a frame, so the port is mono: a second
; walk buys depth that this hardware cannot pay for. 1 walks the scene one
; time for each eye, which is the PCVR mod.
stereo=0

; The red square of the frame id at the top left corner of each present. The
; runtime of the headset reads it to find which frame it captured, so it maps
; the picture with the pose that drew it. Without it the world swims when the
; head turns. 0 is the behavior of the PCVR mod, which has no window to read.
sync_pixel=1
